<!DOCTYPE html>
<html lang="en">
<head> <meta charset="UTF-8"> <title>Anime Stickman Battle: Awakening</title> <style> body {
            margin: 0;
            background: #0f1115;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }.game-wrapper {
           background: #151821;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid #2a2f3d;
        }
        canvas {
            background: #091a15; /* Match your deep dark green theme */
            border-radius: 6px;
            display: block;
        }
        .btn-panel {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }
        button {
            background: #282c37;
            color: #d8dee9;
            border: 2px solid #3b4252;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #434c5e;
            transform: translateY(-2px);
        }
        .btn-attack { border-color: #4c566a; }
        .btn-special { border-color: #2e8b57; color: #a3be8c; }
        .btn-ult { border-color: #bf616a; color: #ff3333; }
        .btn-awaken { border-color: #d08770; color: #ebcb8b; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="380"></canvas>
    <div class="btn-panel">
        <button class="btn-attack" onclick="triggerMove('attack')">Attack [J / Space]</button>
        <button class="btn-special" onclick="triggerMove('special')">Special [K]</button>
        <button class="btn-ult" onclick="triggerMove('ult')">Ultimate [L]</button>
        <button class="btn-awaken" onclick="triggerMove('awaken')">Toggle Awakening</button>
        <button onclick="switchCharacter()">Switch Character</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GROUND_Y = 320;
let screenShake = 0;

// Character Roster Profiles matching your concepts
const ROSTER = [
    {
        name: "Noelle Silva",
        color: "#5e81ac",
        ultName: "WATER CREATION: SEA DRAGON'S ROAR",
        ultQuote: '"I am royalty of the Clover Kingdom! Sea Dragon\'s Majestic Roar!"',
        weaponType: "spear",
        ultType: "dragon"
    },
    {
        name: "Asta",
        color: "#bf616a",
        ultName: "BLACK METEORITE",
        ultQuote: '"Even without magical powers... I will become the Wizard King! Black Meteorite!"',
        weaponType: "greatsword",
        ultType: "dash"
    }
];

let activeFighterIndex = 0;

// Game State Values
let p1 = { x: 200, y: GROUND_Y, vx: 0, vy: 0, health: 908, maxHealth: 1000, sp: 100, isGrounded: true };
let p2 = { x: 600, y: GROUND_Y, health: 1000, maxHealth: 1000, sp: 29 };

// Cinematic Banner State Controls
let cinematic = { active: false, timer: 0, title: "", quote: "", bannerColor: "#ff0000" };

// Controls Event Hooks
window.addEventListener('keydown') , (e) => {
    if (cinematic.active) return; // Freeze simulation during ult cutscenes
    if (e.key === 'a' || e.key === 'ArrowLeft') p1.vx = -4;
    if (e.key === 'd' || e.key === 'ArrowRight') p1.vx = 4;
    if ((e.key === 'w' || e.key === 'ArrowUp') && p1.isGrounded) {
        p1.vy = -12;
        p1.isGrounded = false;
    }
    if (e.key === ' ' || e.key === 'j') triggerMove('attack');
    if (e.key === 'k') triggerMove('special');
    if (e.key === 'l') triggerMove('ult');
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'a' || e.key === 'ArrowLeft' || e.key === 'd' || e.key === 'ArrowRight') p1.vx = 0;
});

function switchCharacter() {
    activeFighterIndex = (activeFighterIndex + 1) % ROSTER.length;
}

function triggerMove(type) {
    let char = ROSTER[activeFighterIndex];
    if (type === 'attack') {
        p1.sp = Math.min(100, p1.sp + 10);
        if (Math.abs(p1.x - p2.x) < 80) p2.health = Math.max(0, p2.health - 25);
    }
    if (type === 'special') {
        p1.sp = Math.min(100, p1.sp + 15);
    }
    if (type === 'ult') {
        // Trigger your signature visual cutscene overlay text
        cinematic.active = true;
        cinematic.timer = 110;
        cinematic.title = char.ultName;
        cinematic.quote = char.ultQuote;
        cinematic.bannerColor = char.color;
        screenShake = 14;
        p2.health = Math.max(0, p2.health - 180);
    }
    if (type === 'awaken') {
        p1.health = 250; // Instantly push into safe low-health awakening threshold
    }
}

function drawBackground() {
    // Stage Mountain Slopes matching your concept screens
    ctx.fillStyle = "#061310";
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(120, 100); ctx.lineTo(240, GROUND_Y); ctx.fill();
    ctx.beginPath(); ctx.moveTo(200, GROUND_Y); ctx.lineTo(380, 50); ctx.lineTo(560, GROUND_Y); ctx.fill();
    ctx.beginPath(); ctx.moveTo(500, GROUND_Y); ctx.lineTo(680, 120); ctx.lineTo(800, GROUND_Y); ctx.fill();

    // Stage ground line
    ctx.strokeStyle = "#2e8b57";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(canvas.width, GROUND_Y); ctx.stroke();
}

function drawHUD() {
    let currentProfile = ROSTER[activeFighterIndex];
    let opposingProfile = ROSTER[(activeFighterIndex + 1) % ROSTER.length];

    // --- TOP CENTER SPLIT ICON ---
    ctx.fillStyle = "#1e222a";
    ctx.beginPath(); ctx.arc(canvas.width/2, 40, 20, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#4c566a"; ctx.stroke();
    ctx.fillStyle = "#e5e9f0"; ctx.font = "bold 10px sans-serif";
    ctx.fillText(p1.health < 300 ? "AWK" : "VS", canvas.width/2 - 9, 44);

    // --- PLAYER 1 HEADER METRICS ---
    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif";
    ctx.fillText(currentProfile.name, 25, 30);
    ctx.font = "12px sans-serif";
    ctx.fillText(`${p1.health} / ${p1.maxHealth}`, 320, 30);
    
    // P1 Health Frame bar
    ctx.fillStyle = "#2e3440"; ctx.fillRect(25, 40, 350, 12);
    ctx.fillStyle = p1.health < 300 ? "#bf616a" : "#5e81ac"; // Flashes red if awakened low health
    ctx.fillRect(25, 40, (p1.health / p1.maxHealth) * 350, 12);

    // SP display metric text
    ctx.fillStyle = "#81a1c1"; ctx.font = "900 11px sans-serif";
    ctx.fillText(`SP: MAX (${p1.sp})`, 310, 68);

    // --- PLAYER 2 METRICS ---
    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif";
    ctx.fillText(opposingProfile.name, canvas.width - 150, 30);
    ctx.font = "12px sans-serif";
    ctx.fillText(`${p2.health} / ${p2.maxHealth}`, canvas.width - 390, 30);
    
    // P2 Health bar
    ctx.fillStyle = "#2e3440"; ctx.fillRect(canvas.width - 375, 40, 350, 12);
    ctx.fillStyle = "#ff5555"; ctx.fillRect(canvas.width - 375, 40, (p2.health / p2.maxHealth) * 350, 12);
    
    ctx.fillStyle = "#81a1c1"; ctx.fillText(`SP: MAX (${p2.sp})`, canvas.width - 370, 68);
}

function drawFighters() {
    let profile = ROSTER[activeFighterIndex];

    // Draw Player 1 (User Character)
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(p1.x, p1.y - 50, 10, 0, Math.PI*2); ctx.stroke(); // Head
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y - 40); ctx.lineTo(p1.x, p1.y - 15); ctx.stroke(); // Spine
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y - 30); ctx.lineTo(p1.x - 15, p1.y - 20); ctx.stroke(); // Arm
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y - 15); ctx.lineTo(p1.x - 10, p1.y); ctx.stroke(); // Leg 1
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y - 15); ctx.lineTo(p1.x + 10, p1.y); ctx.stroke(); // Leg 2

    // Dynamic Weapon overlays based on chosen concept character profile
    ctx.strokeStyle = profile.color; ctx.lineWidth = 3;
    ctx.beginPath();
    if(profile.weaponType === "spear") {
        ctx.moveTo(p1.x - 20, p1.y - 15); ctx.lineTo(p1.x + 30, p1.y - 35);
    } else if(profile.weaponType === "greatsword") {
        ctx.moveTo(p1.x + 5, p1.y - 40); ctx.lineTo(p1.x + 25, p1.y - 10);
    }
    ctx.stroke();

    // Draw Player 2 (Target Dummy Fighter)
    ctx.strokeStyle = "#ff9999"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(p2.x, p2.y - 50, 10, 0, Math.PI*2); ctx.stroke(); // Head
    ctx.beginPath(); ctx.moveTo(p2.x, p2.y - 40); ctx.lineTo(p2.x, p2.y - 15); ctx.stroke(); // Spine
    ctx.beginPath(); ctx.moveTo(p2.x, p2.y - 30); ctx.lineTo(p2.x + 15, p1.y - 20); ctx.stroke(); // Arm
    ctx.beginPath(); ctx.moveTo(p2.x, p2.y - 15); ctx.lineTo(p2.x - 10, p2.y); ctx.stroke(); // Leg 1
    ctx.beginPath(); ctx.moveTo(p2.x, p2.y - 15); ctx.lineTo(p2.x + 10, p2.y); ctx.stroke(); // Leg 2
}

function drawCinematic() {
    if (!cinematic.active) return;
    
    // Draw cinematic letterboxes
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.fillRect(0, 80, canvas.width, 140);
    
    // Colored accents matching current character theme
    ctx.fillStyle = cinematic.bannerColor;
    ctx.fillRect(0, 80, canvas.width, 4);
    ctx.fillRect(0, 216, canvas.width, 4);
    
    // Ultimate Title text output
    ctx.fillStyle = "#ffffff";
    ctx.font = "black italic 24px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(cinematic.title, canvas.width / 2, 130);
    
    // Dialogue quotes matching Black Clover flavor
    ctx.fillStyle = "#d8dee9";
    ctx.font = "italic 14px sans-serif";
    ctx.fillText(cinematic.quote, canvas.width / 2, 175);
    
    // Reset alignment settings back to left for other UI steps
    ctx.textAlign = "left";
    
    cinematic.timer--;
    if (cinematic.timer <= 0) {
        cinematic.active = false;
    }
}

function updateGameLogic() {
