<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STICK LEGENDS — Ult Fighters</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#05060c;
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color:#fff; -webkit-user-select:none; user-select:none;
  }
  #wrap {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #131a2e 0%, #05060c 70%);
  }
  canvas {
    display:block; background:#0a0d16;
    box-shadow:0 0 0 1px #ffffff14, 0 0 80px #000000cc, 0 0 140px #2a3dff22;
    border-radius:4px; touch-action:none;
  }
  #hint {
    position:fixed; bottom:6px; left:0; right:0; text-align:center;
    font-size:11px; letter-spacing:1px; color:#5b6580; pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">P1: A / D / W &nbsp;·&nbsp; F punch, G kick, E ult-I, R ult-II &nbsp;|&nbsp; P2: &#8592; &#8594; &#8593; &nbsp;·&nbsp; K punch, L kick, O ult-I, P ult-II</div>

<script src="js/core.js"></script>
<script src="js/characters.js"></script>
<script src="js/poses.js"></script>
<script src="js/game.js"></script>
</body>
</html>
