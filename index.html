<!-- The button element with an 'id' so JavaScript can find it -->
<button id="postBtn">post</button>

<!-- The text element, hidden by default using the 'style' attribute -->
<p id="message" style="display: none;">malchi is cool</p>

<script>
  // 1. Find both elements on the page
  const button = document.getElementById('postBtn');
  const text = document.getElementById('message');

  // 2. Wait for the user to click the button
  button.addEventListener('click', () => {
    // 3. Change the style from 'none' to 'block' to make it visible
    text.style.display = 'block';
  });
</script>
