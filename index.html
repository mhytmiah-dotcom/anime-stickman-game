<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Stickman Battle: Ultimate Arena</title>
    <style>
        body {
            margin: 0;
            background: #0b0c10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden;
        }
        .game-container {
            background: #1f232d;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            border: 2px solid #2f3645;
            position: relative;
            width: 860px;
        }
        canvas {
            border-radius: 8px;
            display: block;
            background: #050f0c;
        }
        .ui-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }
        button {
            background: #2c313d;
            color: #e5e9f0;
            border: 2px solid #434c5e;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #4c566a;
            transform: translateY(-2px);
        }
        /* Menu Screen Styles */
        .overlay-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1115;
            border-radius: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
        }
        .menu-title {
            font-size: 26px;
            font-weight: bold;
            color: #ebcb8b;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
        }
        .selection-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            justify-content: center;
        }
        .select-card {
            background: #1a1c23;
            border: 2px solid #3b4252;
            padding: 15px;
            border-radius: 10px;
            width: 170px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .select-card:hover, .select-card.active {
            border-color: #81a1c1;
            background: #242933;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Menu State Screen Layer -->
    <div id="gameMenu" class="overlay-menu">
        <!-- Step 1: Stage Select -->
        <div id="stageSelectSection" style="width:100%; text-align:center;">
            <div class="menu-title">SELECT STAGE</div>
            <div class="selection-grid">
                <div class="select-card active" id="stage0" onclick="setStage(0)">
                    <h3 style="color:#bf616a; margin:4px 0;">SHIBUYA INCIDENT</h3>
                    <span style="font-size:11px; color:#6f778a;">Metropolitan Neon Subway</span>
                </div>
                <div class="select-card" id="stage1" onclick="setStage(1)">
                    <h3 style="color:#a3be8c; margin:4px 0;">CLOVER KINGDOM</h3>
                    <span style="font-size:11px; color:#6f778a;">Royal Mountain Magic Citadel</span>
                </div>
            </div>
            <button onclick="goToFighterSelect()" style="border-color:#5e81ac; color:#88c0d0;">NEXT: CHOOSE YOUR FIGHTER →</button>
        </div>

        <!-- Step 2: Fighter Select (Hidden Initially) -->
        <div id="fighterSelectSection" style="width:100%; text-align:center; display:none;">
            <div class="menu-title">CHOOSE YOUR FIGHTER</div>
            <div class="selection-grid">
                <div class="select-card" onclick="startGame(0)" style="color:#ff9400;"><h3>Goku</h3><span style="font-size:10px;color:#777">Kamehameha Cannon</span></div>
                <div class="select-card" onclick="startGame(1)" style="color:#ffffff;"><h3>Luffy</h3><span style="font-size:10px;color:#777">Gear 5 Sun God Nika</span></div>
                <div class="select-card" onclick="startGame(2)" style="color:#bf616a;"><h3>Asta</h3><span style="font-size:10px;color:#777">Black Meteorite Stance</span></div>
                <div class="select-card" onclick="startGame(3)" style="color:#b48ead;"><h3>Julius</h3><span style="font-size:10px;color:#777">Chrono-Stasis Bubble</span></div>
            </div>
            <button onclick="goToStageSelect()" style="border-color:#4c566a; font-size:12px; padding:6px 16px;">← Back to Stages</button>
        </div>
    </div>

    <!-- Active Gameplay Layout -->
    <canvas id="gameCanvas" width="860" height="390"></canvas>
    <div class="ui-buttons">
        <button onclick="handleAction('attack')" style="border-color:#4c566a;">Attack [J / Space]</button>
        <button onclick="handleAction('special')" style="border-color:#2e8b57; color:#a3be8c;">Special [K]</button>
        <button onclick="handleAction('ult')" style="border-color:#bf616a; color:#ff5555;">Ultimate [L]</button>
        <button onclick="returnToMenu()" style="border-color:#d08770; color:#ebcb8b;">Main Menu [R]</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GROUND_Y = 330;
const GRAVITY = 0.5;
let screenShake = 0;
let isPlaying = false;
let currentStageIndex = 0;

// Dynamic Roster Core Configurations
const ROSTER = [
    { name: "Goku", color: "#ff9400", ultName: "SUPER KAMEHAMEHA CONTINUOUS CANNON", quote: '"Ka... Me... Ha... Me... HAAAA!"', ultType: "beam" },
    { name: "Luffy", color: "#ffffff", ultName: "BAJRANG GUN METEOR", quote: '"I can do everything I wanted to do! Gear 5!"', ultType: "impact" },
    { name: "Asta", color: "#bf616a", ultName: "BLACK METEORITE", quote: '"My magic is never giving up!"', ultType: "dash" },
    { name: "Julius Novachrono", color: "#b48ead", ultName: "CHRONO-STASIS TIME CAPSULE", quote: '"In the flow of time, speed is everything."', ultType: "time" }
];

let p1Index = 0;
let p2Index = 1;

// Actors State Registers
let p1 = { x: 200, y: GROUND_Y, vx: 0, vy: 0, health: 1000, sp: 0, grounded: true, attackTime: 0, timeFrozen: false };
let p2 = { x: 660, y: GROUND_Y, vx: 0, vy: 0, health: 1000, sp: 0, grounded: true, attackTime: 0, aiTimer: 0, timeFrozen: false };

let cinematic = { active: false, timer: 0, title: "", quote: "", color: "#fff", attacker: null };

// Navigation Bindings
window.addEventListener('keydown', (e) => {
    if (!isPlaying || cinematic.active || p1.health <= 0) return;
    if (e.key === 'a' || e.key === 'ArrowLeft') p1.vx = -4.5;
    if (e.key === 'd' || e.key === 'ArrowRight') p1.vx = 4.5;
    if ((e.key === 'w' || e.key === 'ArrowUp') && p1.grounded) { p1.vy = -12; p1.grounded = false; }
    if (e.key === ' ' || e.key === 'j') handleAction('attack');
    if (e.key === 'k') handleAction('special');
    if (e.key === 'l') handleAction('ult');
    if (e.key === 'r' || e.key === 'R') returnToMenu();
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'a' || e.key === 'ArrowLeft' || e.key === 'd' || e.key === 'ArrowRight') p1.vx = 0;
});

function setStage(idx) {
    currentStageIndex = idx;
    document.getElementById('stage0').classList.toggle('active', idx === 0);
    document.getElementById('stage1').classList.toggle('active', idx === 1);
}
function goToFighterSelect() {
    document.getElementById('stageSelectSection').style.display = 'none';
    document.getElementById('fighterSelectSection').style.display = 'block';
}
function goToStageSelect() {
    document.getElementById('fighterSelectSection').style.display = 'none';
    document.getElementById('stageSelectSection').style.display = 'block';
}
function startGame(idx) {
    p1Index = idx;
    p2Index = (idx + 1) % ROSTER.length; // Assign separate bot fighter
    document.getElementById('gameMenu').style.display = 'none';
    
    // Clear and restore parameters
    p1 = { x: 220, y: GROUND_Y, vx: 0, vy: 0, health: 1000, sp: 0, grounded: true, attackTime: 0, timeFrozen: false };
    p2 = { x: 640, y: GROUND_Y, vx: 0, vy: 0, health: 1000, sp: 0, grounded: true, attackTime: 0, aiTimer: 0, timeFrozen: false };
    cinematic.active = false;
    isPlaying = true;
}
function returnToMenu() {
    isPlaying = false;
    document.getElementById('gameMenu').style.display = 'flex';
    goToStageSelect();
}

function handleAction(type) {
    if (!isPlaying || cinematic.active || p1.health <= 0) return;
    let profile = ROSTER[p1Index];

    if (type === 'attack' && p1.attackTime <= 0) {
        p1.attackTime = 14;
        p1.sp = Math.min(100, p1.sp + 14);
        if (Math.abs(p1.x - p2.x) < 85 && Math.abs(p1.y - p2.y) < 60) {
            p2.health = Math.max(0, p2.health - 20);
            p2.sp = Math.min(100, p2.sp + 8);
        }
    }
    if (type === 'special') p1.sp = Math.min(100, p1.sp + 25);
    if (type === 'ult' && p1.sp >= 100) {
        p1.sp = 0;
        launchCinematic(profile, p1, p2, 240);
    }
}

function launchCinematic(prof, user, target, dmg) {
    cinematic.active = true;
    cinematic.timer = 110;
    cinematic.title = prof.ultName;
    cinematic.quote = prof.quote;
    cinematic.color = prof.color;
    cinematic.attacker = user;
    screenShake = 16;
    
    setTimeout(() => {
        target.health = Math.max(0, target.health - dmg);
        if (prof.ultType === "time") {
            target.timeFrozen = true;
            setTimeout(() => target.timeFrozen = false, 3000); // 3-second freeze window
        } else {
