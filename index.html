<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Combat: VFX Edition</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas {
            background: #333;
            border: 4px solid #444;
            border-radius: 8px;
        }
        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .health-bar {
            width: 300px;
            height: 20px;
            background: #555;
            border: 3px solid #fff;
            position: relative;
        }
        .health-fill {
            height: 100%;
            width: 100%;
            background: #ff4d4d;
            transition: width 0.2s ease-out;
        }
        .p2-fill { background: #4d79ff; }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: #aaa;
            width: 100%;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui">
        <div class="health-bar"><div id="p1-health" class="health-fill"></div></div>
        <div class="health-bar"><div id="p2-health" class="health-fill p2-fill"></div></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="controls-hint">
        P1: WASD to Move, Space to Attack | P2: Arrows to Move, Enter to Attack
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 1000;
canvas.height = 500;

const gravity = 0.8;
const groundY = 400;

// Game State
let shake = 0;
const particles = [];
const keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.radius = Math.random() * 4;
        this.color = color;
        this.life = 1.0;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.03;
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Stickman {
    constructor(x, color, controls, id) {
        this.id = id;
        this.x = x;
        this.y = groundY;
        this.color = color;
        this.controls = controls;
        this.width = 40;
        this.height = 80;
        
        this.velX = 0;
        this.velY = 0;
        this.health = 100;
        
        this.isAttacking = false;
        this.attackFrame = 0;
        this.isJumping = false;
        this.facing = id === 1 ? 1 : -1; // 1 right, -1 left
        this.hitStun = 0;
    }

    draw() {
        const t = Date.now() / 150; // Animation timer
        const bob = Math.sin(t) * 3; // Idle bobbing
        
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        const headY = this.y - 80 + bob;
        const bodyY = this.y - 50 + bob;

        // Head
        ctx.beginPath();
        ctx.arc(this.x, headY, 8, 0, Math.PI * 2);
        ctx.stroke();

        // Body
        ctx.beginPath();
        ctx.moveTo(this.x, headY + 8);
        ctx.lineTo(this.x, bodyY + 20);
        ctx.stroke();

        // Legs
        const legSway = Math.sin(t) * 10;
        ctx.beginPath();
        ctx.moveTo(this.x, bodyY + 20);
        ctx.lineTo(this.x - 10 + legSway, this.y);
        ctx.moveTo(this.x, bodyY + 20);
        ctx.lineTo(this.x + 10 - legSway, this.y);
        ctx.stroke();

        // Arms / Attack
        if (this.isAttacking) {
            const attackReach = Math.sin(this.attackFrame * 0.5) * 40;
            ctx.beginPath();
            ctx.moveTo(this.x, bodyY + 5);
            ctx.lineTo(this.x + (attackReach * this.facing), bodyY + 5);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(this.x, bodyY + 5);
            ctx.lineTo(this.x - 10, bodyY + 15);
            ctx.moveTo(this.x, bodyY + 5);
            ctx.lineTo(this.x + 10, bodyY + 15);
            ctx.stroke();
        }
    }

    update(opponent) {
        if (this.hitStun > 0) this.hitStun--;

        // Movement
        if (this.hitStun === 0) {
            if (keys[this.controls.left]) { this.velX = -5; this.facing = -1; }
            else if (keys[this.controls.right]) { this.velX = 5; this.facing = 1; }
            else { this.velX *= 0.8; }

            if (keys[this.controls.up] && !this.isJumping) {
                this.velY = -15;
                this.isJumping = true;
            }

            if (keys[this.controls.attack] && !this.isAttacking) {
                this.isAttacking = true;
                this.attackFrame = 0;
            }
        }

        // Physics
        this.x += this.velX;
        this.y += this.velY;
        this.velY += gravity;

        if (this.y >= groundY) {
            this.y = groundY;
            this.velY = 0;
            this.isJumping = false;
        }

        // Attack Logic
        if (this.isAttacking) {
            this.attackFrame++;
            
            // Collision check at peak of punch
            if (this.attackFrame === 5) {
                const dist = Math.abs(this.x - opponent.x);
                if (dist < 60 && Math.abs(this.y - opponent.y) < 40) {
                    this.hitOpponent(opponent);
                }
            }

            if (this.attackFrame > 15) {
                this.isAttacking = false;
            }
        }
    }

    hitOpponent(opponent) {
        opponent.health -= 10;
        opponent.hitStun = 10;
        opponent.velX = this.facing * 15; // Knockback
        opponent.velY = -5;
        
        shake = 10; // Screen shake
        
        // Create VFX particles
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(opponent.x, opponent.y - 40, '#fff'));
            particles.push(new Particle(opponent.x, opponent.y - 40, this.color));
        }
    }
}

const p1 = new Stickman(200, '#ff4d4d', { 
    left: 'KeyA', right: 'KeyD', up: 'KeyW', attack: 'Space' 
}, 1);

const p2 = new Stickman(800, '#4d79ff', { 
    left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', attack: 'Enter' 
}, 2);

function updateUI() {
    document.getElementById('p1-health').style.width = p1.health + '%';
    document.getElementById('p2-health').style.width = p2.health + '%';
}

function loop() {
    // Screen Shake effect
    ctx.save();
    if (shake > 0) {
        ctx.translate(Math.random() * shake - shake/2, Math.random() * shake - shake/2);
        shake *= 0.9;
    }

    // Background
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Floor
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    // Update & Draw Players
    p1.update(p2);
    p2.update(p1);
    p1.draw();
    p2.draw();

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    ctx.restore();
    updateUI();

    if (p1.health <= 0 || p2.health <= 0) {
        ctx.fillStyle = "white";
        ctx.font = "50px Arial";
        ctx.textAlign = "center";
        ctx.fillText(p1.health <= 0 ? "PLAYER 2 WINS!" : "PLAYER 1 WINS!", canvas.width/2, canvas.height/2);
        return; // Stop game
    }

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
