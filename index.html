<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Man Fighter</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { background: #1d2430; max-width: 100vw; max-height: 100vh; box-shadow: 0 0 30px #000; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND = 440;
  const GRAVITY = 2000;
  const ROUND_TIME = 60;

  const keys = {};
  const controls = {
    p1: { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', punch: 'KeyF', kick: 'KeyG' },
    p2: { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', punch: 'KeyJ', kick: 'KeyK' }
  };
  const blockedKeys = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
  window.addEventListener('keydown', e => {
    if (blockedKeys.has(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'KeyR' && state !== 'fight') startRound();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  class Fighter {
    constructor(x, facing, color, name, ctrl) {
      this.startX = x;
      this.facing = facing;
      this.color = color;
      this.name = name;
      this.ctrl = ctrl;
      this.reset();
    }
    reset() {
      this.x = this.startX;
      this.y = GROUND;
      this.vx = 0;
      this.vy = 0;
      this.health = 100;
      this.onGround = true;
      this.attack = null;      // { type, t, duration, hit }
      this.cooldown = 0;
      this.blocking = false;
      this.hitFlash = 0;
      this.walkPhase = 0;
      this.wins = this.wins || 0;
    }
    get alive() { return this.health > 0; }

    update(dt, opponent) {
      const c = this.ctrl;
      const canAct = this.alive && !this.attack && this.hitFlash <= 0.15;

      // Facing toward opponent when grounded and not mid-attack
      if (this.onGround && !this.attack) {
        this.facing = opponent.x >= this.x ? 1 : -1;
      }

      // Blocking
      this.blocking = this.alive && this.onGround && !this.attack && keys[c.down];

      // Movement
      let move = 0;
      if (canAct && !this.blocking) {
        if (keys[c.left]) move -= 1;
        if (keys[c.right]) move += 1;
      }
      const speed = 260;
      if (this.onGround) this.vx = move * speed;
      else this.vx += move * 600 * dt;   // limited air control

      // Jump
      if (canAct && this.onGround && keys[c.up]) {
        this.vy = -760;
        this.onGround = false;
      }

      // Start attacks
      this.cooldown = Math.max(0, this.cooldown - dt);
      if (canAct && this.cooldown <= 0) {
        if (keys[c.punch] && this.onGround) {
          this.attack = { type: 'punch', t: 0, duration: 0.30, hit: false };
          this.cooldown = 0.1;
        } else if (keys[c.kick] && this.onGround) {
          this.attack = { type: 'kick', t: 0, duration: 0.42, hit: false };
          this.cooldown = 0.1;
        }
      }

      // Advance attack
      if (this.attack) {
        this.attack.t += dt;
        if (this.attack.t >= this.attack.duration) this.attack = null;
      }

      // Physics
      this.vy += GRAVITY * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.y >= GROUND) {
        this.y = GROUND;
        this.vy = 0;
        this.onGround = true;
      }
      this.x = Math.max(40, Math.min(W - 40, this.x));

      // Animation
      if (Math.abs(this.vx) > 1 && this.onGround) this.walkPhase += dt * 12;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
    }

    // Active hit window and reach for the current attack
    activeHit() {
      if (!this.attack) return null;
      const a = this.attack;
      const isKick = a.type === 'kick';
      const start = isKick ? 0.12 : 0.08;
      const end = isKick ? 0.26 : 0.20;
      if (a.hit || a.t < start || a.t > end) return null;
      return { reach: isKick ? 95 : 70, damage: isKick ? 12 : 7, knock: isKick ? 320 : 200 };
    }

    takeHit(dmg, knock, fromDir) {
      let d = dmg;
      if (this.blocking) {
        d = dmg * 0.2;
        knock *= 0.3;
      }
      this.health = Math.max(0, this.health - d);
      this.hitFlash = 0.2;
      this.vx = fromDir * knock;
      if (this.blocking) this.vx *= 0.5;
    }

    draw(ctx) {
      const hipY = this.y - 50;
      const neckY = this.y - 92;
      const headY = this.y - 110;
      const f = this.facing;
      const x = this.x;
      const flash = this.hitFlash > 0;
      const col = flash ? '#fff' : this.color;

      ctx.save();
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Legs
      const moving = this.onGround && Math.abs(this.vx) > 1;
      const swing = moving ? Math.sin(this.walkPhase) * 14 : 0;
      let frontFoot, backFoot;
      if (!this.onGround) {
        frontFoot = { x: x + f * 14, y: this.y - 8 };
        backFoot = { x: x - f * 14, y: this.y - 16 };
      } else {
        frontFoot = { x: x + f * (14 + swing), y: this.y };
        backFoot = { x: x - f * (14 + swing), y: this.y };
      }
      if (this.attack && this.attack.type === 'kick') {
        const p = Math.min(1, this.attack.t / 0.12);
        frontFoot = { x: x + f * (14 + 75 * p), y: this.y - 40 * p };
        backFoot = { x: x - f * 8, y: this.y };
      }
      this.line(x, hipY, frontFoot.x, frontFoot.y);
      this.line(x, hipY, backFoot.x, backFoot.y);

      // Torso
      this.line(x, hipY, x, neckY);

      // Arms
      const shoulderY = neckY + 8;
      let frontHand = { x: x + f * 22, y: shoulderY + 22 };
      let backHand = { x: x - f * 20, y: shoulderY + 24 };
      if (this.blocking) {
        frontHand = { x: x + f * 16, y: shoulderY - 12 };
        backHand = { x: x + f * 2, y: shoulderY - 18 };
      } else if (this.attack && this.attack.type === 'punch') {
        const p = Math.min(1, this.attack.t / 0.08);
        frontHand = { x: x + f * (22 + 50 * p), y: shoulderY + 2 };
      } else if (moving) {
        backHand = { x: x - f * (20 + swing * 0.6), y: shoulderY + 22 };
        frontHand = { x: x + f * (22 - swing * 0.6), y: shoulderY + 20 };
      } else if (!this.onGround) {
        frontHand = { x: x + f * 20, y: shoulderY - 8 };
        backHand = { x: x - f * 14, y: shoulderY - 14 };
      }
      this.line(x, shoulderY, frontHand.x, frontHand.y);
      this.line(x, shoulderY, backHand.x, backHand.y);

      // Head
      ctx.beginPath();
      ctx.lineWidth = 4;
      ctx.arc(x, headY, 16, 0, Math.PI * 2);
      ctx.stroke();
      // Eye pointing toward facing direction
      ctx.beginPath();
      ctx.arc(x + f * 6, headY - 3, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Block shield indicator
      if (this.blocking) {
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.arc(x + f * 14, shoulderY - 4, 26, f > 0 ? -Math.PI / 2 : Math.PI / 2, f > 0 ? Math.PI / 2 : -Math.PI / 2 + Math.PI * 2);
        ctx.fillStyle = '#7fd7ff';
        ctx.fill();
      }
      ctx.restore();
    }

    line(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }

  const p1 = new Fighter(260, 1, '#ff6b6b', 'P1', controls.p1);
  const p2 = new Fighter(700, -1, '#6bb8ff', 'P2', controls.p2);

  let state = 'fight';   // 'fight' | 'over'
  let timeLeft = ROUND_TIME;
  let winnerText = '';
  let sparks = [];

  function startRound() {
    p1.reset();
    p2.reset();
    timeLeft = ROUND_TIME;
    sparks = [];
    winnerText = '';
    state = 'fight';
  }

  function endRound(text) {
    state = 'over';
    winnerText = text;
  }

  function resolveCombat() {
    [[p1, p2], [p2, p1]].forEach(([a, b]) => {
      const hit = a.activeHit();
      if (!hit || !b.alive) return;
      const dx = b.x - a.x;
      const inFront = dx * a.facing > 0;
      const inReach = Math.abs(dx) <= hit.reach + 16;
      const inHeight = Math.abs(a.y - b.y) < 60;
      if (inFront && inReach && inHeight) {
        a.attack.hit = true;
        const dir = Math.sign(dx) || a.facing;
        b.takeHit(hit.damage, hit.knock, dir);
        const sx = (a.x + b.x) / 2;
        for (let i = 0; i < 12; i++) {
          sparks.push({
            x: sx, y: b.y - 60,
            vx: (Math.random() - 0.5) * 320,
            vy: (Math.random() - 0.7) * 320,
            life: 0.4
          });
        }
      }
    });
  }

  function drawStage() {
    // Ground
    ctx.fillStyle = '#2b3442';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = '#3d4a5e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(W, GROUND);
    ctx.stroke();
  }

  function drawHUD() {
    const barW = 360, barH = 24, top = 20;
    // P1 bar (left)
    ctx.fillStyle = '#333';
    ctx.fillRect(30, top, barW, barH);
    ctx.fillStyle = p1.color;
    ctx.fillRect(30, top, barW * (p1.health / 100), barH);
    // P2 bar (right, drains toward the right)
    ctx.fillStyle = '#333';
    ctx.fillRect(W - 30 - barW, top, barW, barH);
    ctx.fillStyle = p2.color;
    const w2 = barW * (p2.health / 100);
    ctx.fillRect(W - 30 - w2, top, w2, barH);

    ctx.strokeStyle = '#999';
    ctx.lineWidth = 2;
    ctx.strokeRect(30, top, barW, barH);
    ctx.strokeRect(W - 30 - barW, top, barW, barH);

    ctx.fillStyle = '#eee';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('P1  Wins: ' + p1.wins, 30, top + 44);
    ctx.textAlign = 'right';
    ctx.fillText('P2  Wins: ' + p2.wins, W - 30, top + 44);

    // Timer
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px Arial';
    ctx.fillText(Math.ceil(Math.max(0, timeLeft)), W / 2, top + 30);
  }

  function drawSparks(dt) {
    sparks = sparks.filter(s => s.life > 0);
    for (const s of sparks) {
      s.life -= dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 800 * dt;
      ctx.fillStyle = `rgba(255,220,120,${Math.max(0, s.life * 2.5)})`;
      ctx.fillRect(s.x, s.y, 4, 4);
    }
  }

  function drawOverlay() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 56px Arial';
    ctx.fillText(winnerText, W / 2, H / 2 - 20);
    ctx.font = '22px Arial';
    ctx.fillText('Press R to fight again', W / 2, H / 2 + 30);
  }

  function drawControls() {
    ctx.fillStyle = '#8a97aa';
    ctx.font = '13px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('P1: A/D move  W jump  S block  F punch  G kick', 30, H - 12);
    ctx.textAlign = 'right';
    ctx.fillText('P2: ←/→ move  ↑ jump  ↓ block  J punch  K kick', W - 30, H - 12);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (state === 'fight') {
      timeLeft -= dt;
      p1.update(dt, p2);
      p2.update(dt, p1);
      resolveCombat();

      if (!p1.alive || !p2.alive) {
        if (!p1.alive && !p2.alive) endRound('DRAW!');
        else if (!p1.alive) { p2.wins++; endRound('PLAYER 2 WINS!'); }
        else { p1.wins++; endRound('PLAYER 1 WINS!'); }
      } else if (timeLeft <= 0) {
        timeLeft = 0;
        if (p1.health > p2.health) { p1.wins++; endRound('TIME! PLAYER 1 WINS!'); }
        else if (p2.health > p1.health) { p2.wins++; endRound('TIME! PLAYER 2 WINS!'); }
        else endRound('TIME! DRAW!');
      }
    } else {
      // Let the fallen fighters settle
      p1.update(dt, p2);
      p2.update(dt, p1);
    }

    ctx.clearRect(0, 0, W, H);
    drawStage();
    // Draw the fighter further back first
    if (p1.x < p2.x) { p1.draw(ctx); p2.draw(ctx); }
    else { p2.draw(ctx); p1.draw(ctx); }
    drawSparks(dt);
    drawHUD();
    drawControls();
    if (state === 'over') drawOverlay();

    requestAnimationFrame(frame);
  }

  startRound();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
