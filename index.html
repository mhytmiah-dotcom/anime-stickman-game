<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stickman Showdown - Premium Build</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background: #05050a; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            color: #fff; 
            overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #game-container {
            width: 800px; height: 500px;
            background: #0b0b14;
            border: 4px solid #1a1a2e;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; transition: opacity 0.3s ease; z-index: 5;
        }
        .hidden { display: none !important; opacity: 0; }
        h1 { font-size: 2.3rem; text-shadow: 0 0 15px rgba(247, 37, 133, 0.4); margin-bottom: 25px; color: #fff; text-transform: uppercase; letter-spacing: 3px;}
        
        /* Layouts */
        .grid { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; max-width: 650px; }
        .card {
            background: #121224; border: 2px solid #252542; border-radius: 10px;
            padding: 12px 20px; cursor: pointer; text-align: center; font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); min-width: 130px;
            color: #9999bb; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;
        }
        .card:hover { border-color: #f72585; transform: translateY(-2px); background: #191932; color: #fff; }
        .card.selected { border-color: #4cc9f0; background: #24244d; color: #fff; box-shadow: 0 0 15px rgba(76,201,240,0.3); }
        
        /* Action Buttons */
        .btn {
            background: linear-gradient(135deg, #7209b7, #f72585); color: white;
            border: none; padding: 14px 40px; font-size: 1.1rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; box-shadow: 0 6px 20px rgba(247,37,133,0.3);
            transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { transform: scale(1.04); box-shadow: 0 6px 30px rgba(247,37,133,0.5); }
        
        /* HUD Grid */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px 25px;
            display: flex; justify-content: space-between; z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .health-container { width: 40%; display: flex; flex-direction: column; }
        .p2-align { align-items: flex-end; text-align: right; }
        .fighter-name { font-weight: 800; font-size: 1.2rem; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .bar-outer { width: 100%; height: 16px; background: #111; border: 1px solid #333; border-radius: 20px; overflow: hidden; position: relative; }
        .bar-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #4cc9f0, #4361ee); transition: width 0.1s ease-out; }
        #p2-health { background: linear-gradient(90deg, #f72585, #b5179e); }
        .status-txt { font-size: 0.8rem; margin-top: 5px; color: #8888aa; font-family: monospace; }
        .vs-circle { width: 38px; height: 38px; background: #121224; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 2px solid #252542; font-size: 0.8rem; color: #f72585;}
        
        /* Gameplay Elements */
        canvas { background: #080811; width: 100%; height: 100%; display: block; }
        #ult-banner {
            position: absolute; top: 35px; left: 50%; transform: translateX(-50%);
            font-size: 1.8rem; font-weight: 900; font-style: italic; color: #fff;
            letter-spacing: 3px; text-transform: uppercase; z-index: 20;
            text-align: center; width: 100%; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- STAGE SELECTION SCREEN -->
    <div id="screen-stage" class="screen">
        <h1>Select Battleground</h1>
        <div class="grid">
            <div class="card" onclick="selectStage('Shibuya Wasteland')">Shibuya Wasteland</div>
            <div class="card" onclick="selectStage('Tournament of Power')">Tournament of Power</div>
            <div class="card" onclick="selectStage('Clover Capital')">Clover Capital</div>
        </div>
        <button id="btn-stage-next" class="btn hidden" onclick="goToCharacterScreen()">Next</button>
    </div>

    <!-- CHARACTER SELECTION SCREEN -->
    <div id="screen-char" class="screen hidden">
        <h1>Choose Your Champion</h1>
        <div class="grid">
            <div class="card" onclick="selectFighter('Asta')">Asta</div>
            <div class="card" onclick="selectFighter('Yuno')">Yuno</div>
            <div class="card" onclick="selectFighter('Gojo')">Gojo</div>
            <div class="card" onclick="selectFighter('Sukuna')">Sukuna</div>
            <div class="card" onclick="selectFighter('Julius')">Julius</div>
            <div class="card" onclick="selectFighter('Noelle')">Noelle</div>
            <div class="card" onclick="selectFighter('Goku')">Goku</div>
            <div class="card" onclick="selectFighter('Naruto')">Naruto</div>
            <div class="card" onclick="selectFighter('Luffy')">Luffy</div>
        </div>
        <button id="btn-char-start" class="btn hidden" onclick="startMatch()">Commence Battle</button>
    </div>

    <!-- LOADING HUB SCREEN -->
    <div id="screen-loading" class="screen hidden">
        <h1 style="letter-spacing: 6px; color: #4cc9f0;">Generating Arena...</h1>
        <div class="bar-outer" style="width: 340px; height: 8px; border-radius: 4px;">
            <div id="loading-progress" class="bar-inner" style="width: 0%; background: linear-gradient(90deg, #7209b7, #f72585);"></div>
        </div>
    </div>

    <!-- MAIN GAMEPLAY COMBAT ARENA -->
    <div id="screen-arena" class="screen hidden" style="padding: 0;">
        <div id="hud">
            <div class="health-container">
                <div id="p1-name" class="fighter-name">Player</div>
                <div class="bar-outer"><div id="p1-health" class="bar-inner"></div></div>
                <div id="p1-status" class="status-txt">HP: 1000/1000</div>
            </div>
            <div class="vs-circle">VS</div>
            <div class="health-container p2-align">
                <div id="p2-name" class="fighter-name">CPU</div>
                <div class="bar-outer"><div id="p2-health" class="bar-inner"></div></div>
                <div id="p2-status" class="status-txt">HP: 1000/1000</div>
            </div>
        </div>
        <div id="ult-banner" class="hidden"></div>
        <canvas id="arenaCanvas" width="800" height="500"></canvas>
    </div>

</div>

<script>
    let selectedStage = '';
    let selectedFighter = '';
    const roster = ['Asta','Yuno','Gojo','Sukuna','Julius','Noelle','Goku','Naruto','Luffy'];

    const canvas = document.getElementById('arenaCanvas');
    const ctx = canvas.getContext('2d');

    let gameActive = false;
    let timeStopped = false;
    let timeStopTimer = 0;
    let globalDim = 0; 

    let p1, p2;
    let projectiles = [];
    let particles = [];

    // Controller input handling maps
    const keys = { a: false, d: false, w: false, j: false, k: false };
    window.addEventListener('keydown', e => {
        let k = e.key.toLowerCase();
        if(k === 'a') keys.a = true; if(k === 'd') keys.d = true; if(k === 'w') keys.w = true;
        if(k === 'j') keys.j = true; if(k === 'k') keys.k = true;
    });
    window.addEventListener('keyup', e => {
        let k = e.key.toLowerCase();
        if(k === 'a') keys.a = false; if(k === 'd') keys.d = false; if(k === 'w') keys.w = false;
        if(k === 'j') keys.j = false; if(k === 'k') keys.k = false;
    });

    function selectStage(stageName) {
        selectedStage = stageName;
        document.querySelectorAll('#screen-stage .card').forEach(c => {
            c.classList.toggle('selected', c.innerText === stageName);
        });
        document.getElementById('btn-stage-next').classList.remove('hidden');
    }

    function goToCharacterScreen() {
        document.getElementById('screen-stage').classList.add('hidden');
        document.getElementById('screen-char').classList.remove('hidden');
    }

    function selectFighter(name) {
        selectedFighter = name;
        document.querySelectorAll('#screen-char .card').forEach(c => {
            c.classList.toggle('selected', c.innerText === name);
        });
        document.getElementById('btn-char-start').classList.remove('hidden');
    }

    function startMatch() {
        document.getElementById('screen-char').classList.add('hidden');
        document.getElementById('screen-loading').classList.remove('hidden');
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += 8;
            document.getElementById('loading-progress').style.width = Math.min(100, progress) + '%';
            if(progress >= 100) {
                clearInterval(interval);
                initArena();
            }
        }, 60);
    }

    class Fighter {
        constructor(x, y, name, isCPU) {
            this.x = x; this.y = y; this.name = name; this.isCPU = isCPU;
            this.w = 30; this.h = 74;
            this.hp = 1000; this.maxHp = 1000;
            this.vx = 0; this.vy = 0;
            this.isGrounded = false;
            this.dir = isCPU ? -1 : 1;this.color = this.getCharacterColor();
this.state = 'idle';
this.stateTimer = 0;
this.ultReady = true;
this.isAwakened = false;
this.limbOffset = 0;
}
getCharacterColor() {
const colors = { Asta:'#4e5d6c', Yuno:'#a7f3d0', Gojo:'#a2d2ff', Sukuna:'#ff4d6d', Julius:'#f9c74f', Noelle:'#4cc9f0', Goku:'#f9844a', Naruto:'#f9c74f', Luffy:'#f94144' };
return colors[this.name] || '#ffffff';
}
update() {
this.vy += 0.55;
this.x += this.vx;
this.y += this.vy;
this.vx *= 0.82;
if (this.y >= 395) { this.y = 395; this.vy = 0; this.isGrounded = true; }
if (this.x < 15) this.x = 15;
if (this.x > 755) this.x = 755;
if (this.hp < 300 && !this.isAwakened) {
this.isAwakened = true;
createImpactBurst(this.x, this.y + 35, this.color, 35);
}
if (this.stateTimer > 0) {
this.stateTimer--;
if (this.stateTimer === 0) this.state = 'idle';
}
if (timeStopped && this.isCPU) {
this.limbOffset = Math.sin(Date.now() * 0.06) * 6;
} else {
this.limbOffset = 0;
}
}
// Custom Individual Renderer Configs to Redo Unique Looks per User Prompt
draw() {
ctx.save();
ctx.translate(this.x + this.w/2, this.y + this.h/2);
if (this.isAwakened) {
ctx.shadowBlur = 25; ctx.shadowColor = this.color;
ctx.strokeStyle = this.color; ctx.lineWidth = 3;
ctx.beginPath(); ctx.arc(0, 5, 48, 0, Math.PI*2); ctx.stroke();
}
ctx.lineWidth = 4.5; ctx.lineCap = 'round';
// 1. DESIGN CUSTOM CLOTHES / BODY SHAPES PER FIGHTER
if (this.name === 'Asta') {
ctx.strokeStyle = '#444'; // Dark gray color palette
// Draw a thick black headband asset
ctx.fillStyle = '#111'; ctx.fillRect(-10, -25, 20, 5);
} else if (this.name === 'Yuno') {
ctx.strokeStyle = '#1d3557'; // Deep blue uniform line
ctx.fillStyle = '#a7f3d0'; // Glowing green pendant
ctx.beginPath(); ctx.arc(0, -5, 3, 0, Math.PI*2); ctx.fill();
} else if (this.name === 'Gojo') {
ctx.strokeStyle = '#240046'; // Dark purple uniform line
// Draw white blindfold line block
ctx.fillStyle = '#fff'; ctx.fillRect(-9, -21, 18, 5);
} else if (this.name === 'Sukuna') {
ctx.strokeStyle = '#f1faee'; // Light kimono line styling
// Pink hair spike marks
ctx.fillStyle = '#ff4d6d'; ctx.fillRect(-8, -32, 16, 4);
} else if (this.name === 'Julius') {
ctx.strokeStyle = '#6a040f'; // Royal gold/crimson lines
ctx.fillStyle = '#f9c74f'; ctx.fillRect(-5, -2, 10, 15);
} else if (this.name === 'Noelle') {
ctx.strokeStyle = '#e0f2fe'; // Silver/white silk dress wires
// Valkyrie armor twin-tails block
ctx.fillStyle = '#93c5fd'; ctx.fillRect(-14, -20, 4, 12); ctx.fillRect(10, -20, 4, 12);
} else if (this.name === 'Goku') {
ctx.strokeStyle = '#f9844a'; // Vibrant orange gi lining
ctx.fillStyle = this.isAwakened ? '#f9c74f' : '#2b2d42'; // Blue hair vs yellow hair
ctx.beginPath(); ctx.moveTo(-10, -22); ctx.lineTo(0, -36); ctx.lineTo(10, -22); ctx.fill();
} else if (this.name === 'Naruto') {
ctx.strokeStyle = '#f77f00'; // Bright orange track jacket lines
ctx.fillStyle = '#fcbf49'; // Spiky yellow blonde hair blocks
ctx.beginPath(); ctx.arc(0, -22, 10, Math.PI, 0); ctx.fill();
} else if (this.name === 'Luffy') {
ctx.strokeStyle = '#d62828'; // Red vest line framing
ctx.fillStyle = '#fcbf49'; // Straw Hat brim mapping
ctx.fillRect(-14, -24, 28, 4);
}
// Head core render
ctx.beginPath(); ctx.arc(0, -16, 9, 0, Math.PI * 2); ctx.stroke();
// Spine / Torso lines
ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 18); ctx.stroke();
// Dynamic limb animations
let attackPhase = this.state === 'attacking';
ctx.beginPath();
ctx.moveTo(0, -2); ctx.lineTo(-16 + this.limbOffset, attackPhase ? -10 : 8);
ctx.moveTo(0, -2); ctx.lineTo(16 + this.limbOffset, attackPhase ? -4 : 8);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(0, 18); ctx.lineTo(-12 + this.limbOffset, 38);
ctx.moveTo(0, 18); ctx.lineTo(12 + this.limbOffset, 38);
ctx.stroke();
// Distinct Weapon profiles
if (this.name === 'Asta') {
ctx.strokeStyle = '#111'; ctx.lineWidth = 7;
ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(38 * this.dir, -28); ctx.stroke();
}
ctx.restore();
}
attack() {
if (this.state !== 'idle') return;
this.state = 'attacking'; this.stateTimer = 14;
let target = this.isCPU ? p1 : p2;
let range = (this.name === 'Asta' || this.name === 'Luffy') ? 110 : 65;
if (Math.abs(this.x - target.x) < range && Math.abs(this.y - target.y) < 50) {
target.hp -= this.isAwakened ? 40 : 25;
target.state = 'hit'; target.stateTimer = 12;
target.vx = this.dir * 13;
spawnShockwave(target.x, target.y + 35);
}
}
useUltimate() {
if (!this.ultReady) return;
this.soundTriggerEffect();
this.ultReady = false;
document.getElementById('ult-banner').innerText = ${this.name.toUpperCase()}: ${this.getUltName()};
document.getElementById('ult-banner').classList.remove('hidden');
globalDim = 0.88;
setTimeout(() => {
globalDim = 0;
document.getElementById('ult-banner').classList.add('hidden');
if (this.name === 'Julius') {
timeStopped = true; timeStopTimer = 300;
} else {
projectiles.push({
x: this.x + (60 * this.dir), y: this.y + 15,
vx: this.dir * 3.0, // Retain readability slowdown tracking metrics
type: this.name, owner: this
});
}
}, 1300);
}
getUltName() {
const ults = { Asta:'Black Meteorite Smash', Yuno:'Spirit Storm Vortex', Gojo:'Spatial Distortion Implosion', Sukuna:'Cleave Grid Geometry', Julius:'Chrono Anastasis Bubble', Noelle:"Sea Dragon's Roar Torrent", Goku:'Kamehameha Laser Burst', Naruto:'Rasenshuriken Blade Cloud', Luffy:'Gear 5 Giant Punch' };
return ults[this.name] || 'Finisher';
}
soundTriggerEffect() {
createImpactBurst(this.x + 15, this.y + 35, this.color, 15);
}
}
function initArena() {
document.getElementById('screen-loading').classList.add('hidden');
document.getElementById('screen-arena').classList.remove('hidden');
document.getElementById('p1-name').innerText = selectedFighter;
let cpuPool = roster.filter(f => f !== selectedFighter);
let cpuFighter = cpuPool[Math.floor(Math.random() * cpuPool.length)];
document.getElementById('p2-name').innerText = cpuFighter;
p1 = new Fighter(160, 395, selectedFighter, false);
p2 = new Fighter(610, 395, cpuFighter, true);
projectiles = []; particles = []; gameActive = true;
window.requestAnimationFrame(gameLoop);
}
function spawnShockwave(x, y) {
for(let i=0; i<6; i++) {
particles.push({
x: x, y: y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
life: 18, maxLife: 18, color: '#ffffff'
});
}
}
function createImpactBurst(x, y, color, count) {
for(let i=0; i<count; i++) {
particles.push({
x: x, y: y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
life: 25, maxLife: 25, color: color
});
}
}
function gameLoop() {
if (!gameActive) return;
updateMechanics();
renderCanvas();
window.requestAnimationFrame(gameLoop);
}
function updateMechanics() {
if (timeStopped) {
timeStopTimer--; if (timeStopTimer <= 0) timeStopped = false;
}
p1.update();
if (!timeStopped) p2.update();
// Control interface routing definitions
if (p1.state === 'idle') {
if (keys.a) { p1.vx = -5.5; p1.dir = -1; }
if (keys.d) { p1.vx = 5.5; p1.dir = 1; }
if (keys.w && p1.isGrounded) { p1.vy = -14.5; p1.isGrounded = false; }
if (keys.j) p1.attack();
if (keys.k) p1.useUltimate();
}
// Automatic CPU simulation runtime parameters
if (!timeStopped && p2.state === 'idle') {
let dist = Math.abs(p1.x - p2.x);
p2.dir = p1.x < p2.x ? -1 : 1;
if (dist > 75) p2.vx = p2.dir * 3.8;
else if (Math.random() < 0.07) p2.attack();
if (Math.random() < 0.003) p2.useUltimate();
}
// 2. REDO ALL THE ULTIMATES TO EXTRACT TRULY UNIQUE GEOMETRIC STRUCTURES
for (let i = projectiles.length - 1; i >= 0; i--) {
let p = projectiles[i];
p.x += p.vx;
let target = p.owner.isCPU ? p1 : p2;
if (Math.abs(p.x - target.x) < 45 && Math.abs(p.y - target.y) < 55) {
target.hp -= 160; target.state = 'hit'; target.stateTimer = 16;
target.vx = (p.vx > 0 ? 1 : -1) * 22;
createImpactBurst(p.x, p.y, p.owner.color, 30);
projectiles.splice(i, 1);
continue;
}
if (p.x < -150 || p.x > 950) projectiles.splice(i, 1);
}
for (let i = particles.length - 1; i >= 0; i--) {
let pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.life--;
if (pt.life <= 0) particles.splice(i, 1);
}
document.getElementById('p1-health').style.width = Math.max(0, (p1.hp / p1.maxHp) * 100) + '%';
document.getElementById('p1-status').innerText = HP: ${Math.max(0, Math.floor(p1.hp))}/1000 ${p1.isAwakened ? '⚡ AWAKENED' : ''};
document.getElementById('p2-health').style.width = Math.max(0, (p2.hp / p2.maxHp) * 100) + '%';
document.getElementById('p2-status').innerText = HP: ${Math.max(0, Math.floor(p2.hp))}/1000 ${p2.isAwakened ? '⚡ AWAKENED' : ''};
if (p1.hp <= 0 || p2.hp <= 0) {
gameActive = false;
setTimeout(initArena, 1100); // Trigger instant round loop restart cleanly
}
}
function renderCanvas() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Stage Environment Background Layout Canvas Sets
if (selectedStage === 'Shibuya Wasteland') {
ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#1c1c30'; ctx.fillRect(80, 220, 90, 250); ctx.fillRect(520, 180, 110, 290);
} else if (selectedStage === 'Tournament of Power') {
ctx.fillStyle = '#150f1c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#3a2d4c'; ctx.beginPath(); ctx.moveTo(0, 470); ctx.lineTo(400, 390); ctx.lineTo(800, 470); ctx.fill();
} else {
ctx.fillStyle = '#080d14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#1b263b'; ctx.fillRect(40, 320, 720, 15);
}
ctx.fillStyle = '#050508'; ctx.fillRect(0, 465, canvas.width, 35);
p1.draw(); p2.draw();
// 3. SEPARATE RENDER STRUCTS PER UNIQUE ULTIMATE ELEMENT
projectiles.forEach(p => {
ctx.save();
ctx.shadowBlur = 20; ctx.shadowColor = p.owner.color;
ctx.strokeStyle = p.owner.color; ctx.lineWidth = 4;
if (p.type === 'Goku') {
// Continuous laser beam layout - no ball structure
ctx.fillStyle = '#4cc9f0';
ctx.fillRect(p.x, p.y - 15, p.vx * 40, 30);
}
else if (p.type === 'Naruto') {
// Sharp spinning wind shuriken matrix geometry
ctx.translate(p.x, p.y); ctx.rotate(Date.now() * 0.025);
ctx.beginPath();
for(let j=0; j<4; j++) {
ctx.rotate(Math.PI / 2);
ctx.lineTo(0, -38); ctx.lineTo(12, -12);
}
ctx.closePath(); ctx.stroke();
}
else if (p.type === 'Gojo') {
// Spatial void cracking line structural matrix
ctx.beginPath();
for(let d=0; d<6; d++) {
let ang = (d * Math.PI) / 3;
ctx.moveTo(p.x, p.y);
ctx.lineTo(p.x + Math.cos(ang)*35, p.y + Math.sin(ang)*35);
}
ctx.stroke();
}
else if (p.type === 'Yuno') {
// Large vertical emerald air slice wall
ctx.beginPath();
ctx.moveTo(p.x, p.y - 45); ctx.lineTo(p.x, p.y + 45);
ctx.stroke();
}
else if (p.type === 'Luffy') {
// Massive square block boxing fist
ctx.fillStyle = '#d62828';
ctx.fillRect(p.x - 20, p.y - 30, 50, 60);
}
else if (p.type === 'Sukuna') {
// Vertical geometric grid system matrix lines
ctx.beginPath();
ctx.moveTo(p.x - 15, p.y - 35); ctx.lineTo(p.x - 15, p.y + 35);
ctx.moveTo(p.x + 15, p.y - 35); ctx.lineTo(p.x + 15, p.y + 35);
ctx.moveTo(p.x - 30, p.y); ctx.lineTo(p.x + 30, p.y);
ctx.stroke();
}
else if (p.type === 'Noelle') {
// Jagged sinuous blue water whip strand lines
ctx.beginPath();
ctx.moveTo(p.x, p.y);
for(let step=0; step<60; step+=8) {
ctx.lineTo(p.x + step * (p.vx > 0 ? 1 : -1), p.y + Math.sin(step + Date.now()*0.15)*18);
}
ctx.stroke();
}
else if (p.type === 'Asta') {
// Giant wide diagonal black cleavage trail
ctx.strokeStyle = '#222222'; ctx.lineWidth = 12;
ctx.beginPath();
ctx.moveTo(p.x - 20 * (p.vx > 0 ? 1 : -1), p.y + 30);
ctx.lineTo(p.x + 30 * (p.vx > 0 ? 1 : -1), p.y - 30);
ctx.stroke();
}
ctx.restore();
});
// Julius temporal lock grid ring
