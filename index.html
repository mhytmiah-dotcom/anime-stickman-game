<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stickman Fight: Arcade Edition</title>
    <style>
        body {
            margin: 0;
            background: #0b0d13;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            border: 3px solid #434c5e;
            background: #1a1c23;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border-radius: 6px;
        }
        .controls-hint {
            margin-top: 15px;
            color: #a3be8c;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 8px 18px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="850" height="400"></canvas>
<div class="controls-hint">A/D or Arrows: Move | W or Up: Jump | J or Space: Punch | K: ULTIMATE | R: Instant Restart</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Engine Config
const GRAVITY = 0.5;
const GROUND_Y = 350;
let currentLevel = 1;

// Controls Input Trackers
const keys = { left: false, right: false };

// Particles and VFX System
let particles = [];
let screenShake = 0;

// Player Fighter State
let p1Health = 100;
let p1Ult = 0; 
const playerAttack = { active: false, timer: 0, range: 45, isUlt: false };

const player = {
    x: 150, y: GROUND_Y,
    vx: 0, vy: 0,
    speed: 5, jumpForce: 12,
    isGrounded: false
};

// Enemy Fighter State
let enemyHealth = 100;
let enemyMaxHealth = 100;
let enemyUlt = 0;
const enemyAttack = { active: false, timer: 0, range: 45, isUlt: false };

const enemy = {
    x: 700, y: GROUND_Y,
    vx: 0, vy: 0,
    speed: 2,
    cooldownTimer: 0
};

// Spawn Particle Splatters
function spawnParticles(x, y, color, count = 8, speedMultiplier = 1) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8 * speedMultiplier,
            vy: (Math.random() - 0.5) * 8 * speedMultiplier,
            radius: Math.random() * 3 + 2,
            alpha: 1,
            color: color
        });
    }
}

// Full Engine Core State Reset
function resetGameEngine() {
    currentLevel = 1;
    p1Health = 100;
    p1Ult = 0;
    enemyMaxHealth = 100;
    enemyHealth = 100;
    enemyUlt = 0;
    player.x = 150; player.y = GROUND_Y; player.vx = 0; player.vy = 0;
    enemy.x = 700; enemy.y = GROUND_Y; enemy.vx = 0; enemy.vy = 0;
    particles = [];
    screenShake = 0;
}

// Setup Key Handlers
window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
        resetGameEngine();
        return;
    }

    if (p1Health <= 0) return;
    
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if ((e.key === 'ArrowUp' || e.key === 'w') && player.isGrounded) {
        player.vy = -player.jumpForce;
        player.isGrounded = false;
    }
    // Basic Punch
    if (e.key === ' ' || e.key === 'j') {
        if (!playerAttack.active) {
            playerAttack.active = true;
            playerAttack.timer = 10;
            playerAttack.isUlt = false;
            p1Ult = Math.min(100, p1Ult + 8); 
            checkCombatCollision(player, enemy, playerAttack.range, true, 12);
        }
    }
    // Trigger Ultimate Move (K)
    if (e.key === 'k' || e.key === 'K') {
        if (p1Ult >= 100 && !playerAttack.active) {
            p1Ult = 0;
            playerAttack.active = true;
            playerAttack.timer = 25; 
            playerAttack.isUlt = true;
            screenShake = 15; 
            checkCombatCollision(player, enemy, 160, true, 40); 
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// Collision Engine with Particle Hook
function checkCombatCollision(attacker, defender, range, isPlayerAttacking, damage) {
    const distance = Math.abs(attacker.x - defender.x);
    if (distance <= range && Math.abs(attacker.y - defender.y) < 60) {
        let midX = (attacker.x + defender.x) / 2;
        let midY = defender.y - 40;

        if (isPlayerAttacking && enemyHealth > 0) {
            enemyHealth = Math.max(0, enemyHealth - damage);
            enemyUlt = Math.min(100, enemyUlt + 15); 
            if (playerAttack.isUlt) {
                enemy.vx = (defender.x > attacker.x) ? 16 : -16; 
                spawnParticles(midX, midY, '#ff9400', 25, 2);
            } else {
                spawnParticles(midX, midY, '#ff3333', 10, 1);
            }
        } else if (!isPlayerAttacking && p1Health > 0) {
            p1Health = Math.max(0, p1Health - damage);
            p1Ult = Math.min(100, p1Ult + 20); 
            if (enemyAttack.isUlt) {
                player.vx = (defender.x > attacker.x) ? 16 : -16; 
                spawnParticles(midX, midY, '#b48ead', 25, 2);
            } else {
                spawnParticles(midX, midY, '#00ffcc', 10, 1);
            }
        }
    }
}

// Player Physics Updates
function updatePlayer() {
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.7; 

    player.x += player.vx;
    player.vy += GRAVITY;
    player.y += player.vy;

    if (player.y >= GROUND_Y) {
        player.y = GROUND_Y; player.vy = 0; player.isGrounded = true;
    }

    if (player.x < 20) player.x = 20;
    if (player.x > canvas.width - 20) player.x = canvas.width - 20;
}

// AI Behaviour Updates
function updateEnemyAI() {
    if (enemyHealth <= 0 || p1Health <= 0) return;

    const scaleSpeed = 2 + (currentLevel * 0.3);
    const distToPlayer = player.x - enemy.x;
    const absDist = Math.abs(distToPlayer);

    enemy.vx *= 0.85;
    enemy.x += enemy.vx;

    if (enemy.cooldownTimer > 0) {
        enemy.cooldownTimer--;
    } else {
        if (enemyUlt >= 100 && absDist < 150) {
            enemyUlt = 0;
            enemyAttack.active = true;
            enemyAttack.timer = 30;
            enemyAttack.isUlt = true;
            enemy.cooldownTimer = 60;
            screenShake = 12;
            checkCombatCollision(enemy, player, 140, false, 30);
            return;
        }

        if (absDist > 40) {
            enemy.x += Math.sign(distToPlayer) * scaleSpeed;
        } else {
            enemyAttack.active = true;
            enemyAttack.timer = 12;
            enemyAttack.isUlt = false;
            enemy.cooldownTimer = 40 - Math.min(20, currentLevel * 2); 
            checkCombatCollision(enemy, player, enemyAttack.range, false, 8 + currentLevel);
        }
    }
}

function advanceLevel() {
    spawnParticles(enemy.x, GROUND_Y - 30, '#ff3333', 30, 1.5);
    currentLevel++;
    enemyMaxHealth = 100 + (currentLevel * 15);
    enemyHealth = enemyMaxHealth;
    enemy.x = 700;
    enemy.y = GROUND_Y;
    enemy.vx = 0;
    enemyUlt = 0;
    p1Health = Math.min(100, p1Health + 30);
}

// Render Backdrop Layout
function drawBackgroundEnvironment() {
    // Cyber City Building Outlines
    ctx.fillStyle = '#222631';
    ctx.fillRect(60, 180, 90, 170);
    ctx.fillRect(200, 120, 110, 230);
    ctx.fillRect(400, 200, 80, 150);
    ctx.fillRect(570, 140, 100, 210);
    ctx.fillRect(720, 220, 70, 130);

    // Neon Horizon Accent Line
    ctx.strokeStyle = '#2e3440';
    ctx.lineWidth = 1;
    for(let i = GROUND_Y; i < canvas.height; i += 12) {
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }
}

// Drawing Functions
function drawStickman(x, y, attackState, mainColor, ultColor) {
    const isAttacking = attackState.active;
    const isUlt = attackState.isUlt;

    ctx.strokeStyle = (isAttacking && isUlt) ? ultColor : mainColor;
    ctx.lineWidth = isUlt ? 6 : 4;
    ctx.lineCap = 'round';

    // Glow Filter setup for action frames
    if (isAttacking) {
        ctx.shadowBlur = isUlt ? 15 : 6;
        ctx.shadowColor = isUlt ? ultColor : mainColor;
    }

    // Head & Spine
    ctx.beginPath(); ctx.arc(x, y - 60, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - 48); ctx.lineTo(x, y - 20); ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(x, y - 40);
    if (isAttacking) {
        let reach = isUlt ? 55 : 28;
        let direction = (mainColor === '#00ffcc') ? reach : -reach;
        ctx.lineTo(x + direction, y - 42); 
    } else {
        ctx.lineTo(x - 12, y - 25);
    }
    ctx.moveTo(x, y - 40);
    ctx.lineTo(x + 12, y - 25);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(x, y - 20); ctx.lineTo(x - 12, y);
    ctx.moveTo(x, y - 20); ctx.lineTo(x + 12, y);
    ctx.stroke();
    
    // Clear shadow state
    ctx.shadowBlur = 0;
}

// Particle Engine Updates
function updateAndDrawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // Small particle gravity drop
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawUI() {
    ctx.font = "bold 22px sans-serif";
    ctx.fillStyle = "#81a1c1";
    ctx.fillText(`STAGE 0${currentLevel}`, canvas.width / 2 - 48, 38);

    // Player HUD
    ctx.font = "bold 11px sans-serif";
