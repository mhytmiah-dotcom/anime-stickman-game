<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stickman Starter Core</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            border: 2px solid #fff;
            background: #222;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.5;
const GROUND_Y = 350;

const keys = {
    left: false,
    right: false,
    up: false
};

const player = {
    x: 100,
    y: GROUND_Y,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpForce: 12,
    isGrounded: false,
    size: 40 
};


window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if ((e.key === 'ArrowUp' || e.key === 'w') && player.isGrounded) {
        player.vy = -player.jumpForce;
        player.isGrounded = false;
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});


function update() {

    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx = 0;

    player.x += player.vx;

    player.vy += GRAVITY;
    player.y += player.vy;

  
    if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.isGrounded = true;
    }

    
    if (player.x < 20) player.x = 20;
    if (player.x > canvas.width - 20) player.x = canvas.width - 20;
}


function drawStickman(x, y) {
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

   
    ctx.beginPath();
    ctx.arc(x, y - 60, 12, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y - 48);
    ctx.lineTo(x, y - 20);
    ctx.stroke();


    ctx.beginPath();
    ctx.moveTo(x, y - 40);
   
    ctx.lineTo(x - 15, y - (keys.left ? 45 : 30));
    ctx.moveTo(x, y - 40);
    
    ctx.lineTo(x + 15, y - (keys.right ? 45 : 30));
    ctx.stroke();

  
    ctx.beginPath();
    ctx.moveTo(x, y - 20);
   
    ctx.lineTo(x - 12, y);
    ctx.moveTo(x, y - 20);
   
    ctx.lineTo(x + 12, y);
    ctx.stroke();
}


function drawEnvironment() {
    
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();
}


function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    update();
    drawEnvironment();
    drawStickman(player.x, player.y);

    requestAnimationFrame(loop);
}


loop()
let p1Health = 100;
let enemyHealth = 100;


const playerAttack = { active: false, timer: 0, range: 40 };
const enemyAttack = { active: false, timer: 0, range: 40 };


const enemy = {
    x: 600,
    y: GROUND_Y,
    vx: 0,
    vy: 0,
    speed: 2,
    size: 40,
    state: 'CHASE',
    cooldownTimer: 0
};


window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'j') { 
        if (!playerAttack.active) {
            playerAttack.active = true;
            playerAttack.timer = 10;
            checkCombatCollision(player, enemy, playerAttack.range, true);
        }
    }
});


function checkCombatCollision(attacker, defender, range, isPlayerAttacking) {
    
    const distance = Math.abs(attacker.x - defender.x);
    
   
    if (distance <= range && Math.abs(attacker.y - defender.y) < 50) {
        if (isPlayerAttacking) {
            enemyHealth = Math.max(0, enemyHealth - 15);
        } else {
            p1Health = Math.max(0, p1Health - 10);
        }
    }
}


function updateEnemyAI() {
    if (enemyHealth <= 0) return;

    const distToPlayer = player.x - enemy.x;
    const absDist = Math.abs(distToPlayer);

    if (enemy.cooldownTimer > 0) {
        enemy.cooldownTimer--;
        enemy.vx = 0;
    } else if (absDist > 35) {
       
        enemy.vx = Math.sign(distToPlayer) * enemy.speed;
        enemy.x += enemy.vx;
    } else {
       
        enemy.vx = 0;
        enemyAttack.active = true;
        enemyAttack.timer = 15;
        enemy.cooldownTimer = 45;
        checkCombatCollision(enemy, player, enemyAttack.range, false);
    }
}


function drawUI() {
    
    ctx.fillStyle = '#444';
    ctx.fillRect(20, 20, 200, 20);
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(20, 20, p1Health * 2, 20);
    ctx.fillStyle = '#fff';
    ctx.fillText("PLAYER", 25, 34);

    
    ctx.fillStyle = '#444';
    ctx.fillRect(canvas.width - 220, 20, 200, 20);
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(canvas.width - 220, 20, enemyHealth * 2, 20);
    ctx.fillStyle = '#fff';
    ctx.fillText("AI ENEMY", canvas.width - 215, 34);
    
  
    ctx.font = "24px sans-serif";
    if (enemyHealth <= 0) {
        ctx.fillStyle = '#00ffcc';
        ctx.fillText("VICTORY!", canvas.width / 2 - 50, 100);
    } else if (p1Health <= 0) {
        ctx.fillStyle = '#ff3333';
        ctx.fillText("GAME OVER", canvas.width / 2 - 60, 100);
    }
}


function drawEnemy(x, y) {
    if (enemyHealth <= 0) {
   
        ctx.strokeStyle = '#555555';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x - 20, y); ctx.lineTo(x + 20, y);
        ctx.stroke();
        return;
    }

    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

  
    ctx.beginPath(); ctx.arc(x, y - 60, 12, 0, Math.PI * 2); ctx.stroke();
    // Spine
    ctx.beginPath(); ctx.moveTo(x, y - 48); ctx.lineTo(x, y - 20); ctx.stroke();

    
    ctx.beginPath();
    ctx.moveTo(x, y - 40);
    if (enemyAttack.active) {
        ctx.lineTo(x - 25, y - 40); 
    } else {
        ctx.lineTo(x - 12, y - 25);
    }
    ctx.moveTo(x, y - 40);
    ctx.lineTo(x + 12, y - 25);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(x, y - 20); ctx.lineTo(x - 12, y);
    ctx.moveTo(x, y - 20); ctx.lineTo(x + 12, y);
    ctx.stroke();
}


function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

   
    if (playerAttack.active) { playerAttack.timer--; if(playerAttack.timer <= 0) playerAttack.active = false; }
    if (enemyAttack.active) { enemyAttack.timer--; if(enemyAttack.timer <= 0) enemyAttack.active = false; }

   
    if (p1Health > 0) update(); 
    updateEnemyAI();

   
    drawEnvironment();
    drawStickman(player.x, player.y);
    drawEnemy(enemy.x, enemy.y);
    drawUI();

    requestAnimationFrame(loop);
}

</script>

</body>
</html>
