<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stickman Fight: Ultimate Edition Fixed</title>
    <style>
        body {
            margin: 0;
            background: #0f111a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            border: 3px solid #3b4252;
            background: #1e222a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }
        .controls-hint {
            margin-top: 15px;
            color: #a3be8c;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="850" height="400"></canvas>
<div class="controls-hint">A/D or Arrows: Move | W or Up: Jump | J or Space: Punch | K: ULTIMATE (Requires 100% Ult)</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Engine Config
const GRAVITY = 0.5;
const GROUND_Y = 350;
let currentLevel = 1;

// Controls Input Trackers
const keys = { left: false, right: false };

// Player Fighter State
let p1Health = 100;
let p1Ult = 0; 
const playerAttack = { active: false, timer: 0, range: 45, isUlt: false };

const player = {
    x: 150,
    y: GROUND_Y,
    vx: 0, vy: 0,
    speed: 5, jumpForce: 12,
    isGrounded: false
};

// Enemy Fighter State
let enemyHealth = 100;
let enemyMaxHealth = 100;
let enemyUlt = 0;
const enemyAttack = { active: false, timer: 0, range: 45, isUlt: false };

const enemy = {
    x: 700,
    y: GROUND_Y,
    vx: 0, vy: 0,
    speed: 2,
    cooldownTimer: 0
};

// Visual Effects
let screenShake = 0;

// Setup Key Handlers
window.addEventListener('keydown', (e) => {
    if (p1Health <= 0) return;
    
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if ((e.key === 'ArrowUp' || e.key === 'w') && player.isGrounded) {
        player.vy = -player.jumpForce;
        player.isGrounded = false;
    }
    // Basic Punch
    if (e.key === ' ' || e.key === 'j') {
        if (!playerAttack.active) {
            playerAttack.active = true;
            playerAttack.timer = 10;
            playerAttack.isUlt = false;
            p1Ult = Math.min(100, p1Ult + 8); 
            checkCombatCollision(player, enemy, playerAttack.range, true, 12);
        }
    }
    // Trigger Ultimate Move (K)
    if (e.key === 'k' || e.key === 'K') {
        if (p1Ult >= 100 && !playerAttack.active) {
            p1Ult = 0;
            playerAttack.active = true;
            playerAttack.timer = 25; 
            playerAttack.isUlt = true;
            screenShake = 15; 
            checkCombatCollision(player, enemy, 160, true, 40); 
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// Collision Engine
function checkCombatCollision(attacker, defender, range, isPlayerAttacking, damage) {
    const distance = Math.abs(attacker.x - defender.x);
    if (distance <= range && Math.abs(attacker.y - defender.y) < 60) {
        if (isPlayerAttacking && enemyHealth > 0) {
            enemyHealth = Math.max(0, enemyHealth - damage);
            enemyUlt = Math.min(100, enemyUlt + 15); 
            if (playerAttack.isUlt) enemy.vx = (defender.x > attacker.x) ? 15 : -15; 
        } else if (!isPlayerAttacking && p1Health > 0) {
            p1Health = Math.max(0, p1Health - damage);
            p1Ult = Math.min(100, p1Ult + 20); 
            if (enemyAttack.isUlt) player.vx = (defender.x > attacker.x) ? 15 : -15; 
        }
    }
}

// Player Physics Updates
function updatePlayer() {
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.7; 

    player.x += player.vx;
    player.vy += GRAVITY;
    player.y += player.vy;

    if (player.y >= GROUND_Y) {
        player.y = GROUND_Y; player.vy = 0; player.isGrounded = true;
    }

    if (player.x < 20) player.x = 20;
    if (player.x > canvas.width - 20) player.x = canvas.width - 20;
}

// AI Behaviour Updates
function updateEnemyAI() {
    if (enemyHealth <= 0 || p1Health <= 0) return;

    const scaleSpeed = 2 + (currentLevel * 0.3);
    const distToPlayer = player.x - enemy.x;
    const absDist = Math.abs(distToPlayer);

    enemy.vx *= 0.85;
    enemy.x += enemy.vx;

    if (enemy.cooldownTimer > 0) {
        enemy.cooldownTimer--;
    } else {
        if (enemyUlt >= 100 && absDist < 150) {
            enemyUlt = 0;
            enemyAttack.active = true;
            enemyAttack.timer = 30;
            enemyAttack.isUlt = true;
            enemy.cooldownTimer = 60;
            screenShake = 12;
            checkCombatCollision(enemy, player, 140, false, 30);
            return;
        }

        if (absDist > 40) {
            enemy.x += Math.sign(distToPlayer) * scaleSpeed;
        } else {
            enemyAttack.active = true;
            enemyAttack.timer = 12;
            enemyAttack.isUlt = false;
            enemy.cooldownTimer = 40 - Math.min(20, currentLevel * 2); 
            checkCombatCollision(enemy, player, enemyAttack.range, false, 8 + currentLevel);
        }
    }
}

function advanceLevel() {
    currentLevel++;
    enemyMaxHealth = 100 + (currentLevel * 15);
    enemyHealth = enemyMaxHealth;
    enemy.x = 700;
    enemy.y = GROUND_Y;
    enemy.vx = 0;
    enemyUlt = 0;
    p1Health = Math.min(100, p1Health + 30);
}

// Drawing Functions
function drawStickman(x, y, attackState, mainColor, ultColor) {
    const isAttacking = attackState.active;
    const isUlt = attackState.isUlt;

    ctx.strokeStyle = (isAttacking && isUlt) ? ultColor : mainColor;
    ctx.lineWidth = isUlt ? 6 : 4;
    ctx.lineCap = 'round';

    // Head & Spine
    ctx.beginPath(); ctx.arc(x, y - 60, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - 48); ctx.lineTo(x, y - 20); ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(x, y - 40);
    if (isAttacking) {
        let reach = isUlt ? 50 : 25;
        let direction = (mainColor === '#00ffcc') ? reach : -reach;
        ctx.lineTo(x + direction, y - 42); 
        
        if (isUlt) {
            ctx.fillStyle = ultColor;
            ctx.beginPath(); ctx.arc(x + direction, y - 42, 15, 0, Math.PI*2); ctx.fill();
        }
    } else {
        ctx.lineTo(x - 12, y - 25);
    }
    ctx.moveTo(x, y - 40);
    ctx.lineTo(x + 12, y - 25);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(x, y - 20); ctx.lineTo(x - 12, y);
    ctx.moveTo(x, y - 20); ctx.lineTo(x + 12, y);
    ctx.stroke();
}

function drawUI() {
    ctx.font = "bold 20px sans-serif";
    ctx.fillStyle = "#e5e9f0";
    ctx.fillText(`STAGE 0${currentLevel}`, canvas.width / 2 - 45, 35);

    // Player HUD
    ctx.font = "12px sans-serif";
    ctx.fillStyle = '#4c566a'; ctx.fillRect(30, 20, 200, 16);
    ctx.fillStyle = '#00ffcc'; ctx.fillRect(30, 20, p1Health * 2, 16); 
    ctx.fillStyle = '#fff'; ctx.fillText("PLAYER HP", 35, 32);

    ctx.fillStyle = '#4c566a'; ctx.fillRect(30, 42, 200, 8);
    ctx.fillStyle = '#bf616a'; ctx.fillRect(30, 42, p1Ult * 2, 8); 
    if(p1Ult >= 100) {
        ctx.fillStyle = '#fff'; ctx.font = "italic bold 10px sans-serif";
        ctx.fillText("ULT READY [K]", 240, 50);
    }

    // Enemy HUD
    ctx.font = "12px sans-serif";
    ctx.fillStyle = '#4c566a'; ctx.fillRect(canvas.width - 230, 20, 200, 16);
    ctx.fillStyle = '#ff3333'; ctx.fillRect(canvas.width - 230, 20, (enemyHealth / enemyMaxHealth) * 200, 16);
    ctx.fillStyle = '#fff'; ctx.fillText(`AI FOE (LVL ${currentLevel})`, canvas.width - 225, 32);

    ctx.fillStyle = '#4c566a'; ctx.fillRect(canvas.width - 230, 42, 200, 8);
    ctx.fillStyle = '#b48ead'; ctx.fillRect(canvas.width - 230, 42, enemyUlt * 2, 8); 

    if (p1Health <= 0) {
        ctx.font = "bold 36px sans-serif";
        ctx.fillStyle = '#bf616a';
        ctx.fillText("GAME OVER", canvas.width / 2 - 100, 180);
    }
}

// Main Frame Run loop
function loop() {
    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Timers
    if (playerAttack.active) { playerAttack.timer--; if(playerAttack.timer <= 0) playerAttack.active = false; }
    if (enemyAttack.active) { enemyAttack.timer--; if(enemyAttack.timer <= 0) enemyAttack.active = false; }

    // Logic Ticks
    if (p1Health > 0) updatePlayer();
    if (enemyHealth > 0) {
        updateEnemyAI();
    } else {
        advanceLevel();
    }

    // Ground line
    ctx.strokeStyle = '#4c566a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(canvas.width, GROUND_Y); ctx.stroke();

    // Render Characters
    if (p1Health > 0) drawStickman(player.x, player.y, playerAttack, '#00ffcc', '#ff9400');
    if (enemyHealth > 0) drawStickman(enemy.x, enemy.y, enemyAttack, '#ff3333', '#b48ead');

    drawUI();
    ctx.restore();

    requestAnimationFrame(loop);
}

// Start game
loop();
</script>
</body>
</html>
