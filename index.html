<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Neon Combat</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }
        canvas {
            background: #111;
            border: 2px solid #333;
            border-radius: 4px;
        }
        .ui {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
            user-select: none;
        }
        .health-container {
            width: 350px;
            text-align: center;
        }
        .health-label {
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .health-bar {
            width: 100%;
            height: 15px;
            background: #222;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3e3e, #ff8a8a);
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .p2-fill { background: linear-gradient(90deg, #3e7fff, #8aafff); }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: #666;
            width: 100%;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui">
        <div class="health-container">
            <div class="health-label">Player 1</div>
            <div class="health-bar"><div id="p1-health" class="health-fill"></div></div>
        </div>
        <div class="health-container">
            <div class="health-label">Player 2</div>
            <div class="health-bar"><div id="p2-health" class="health-fill p2-fill"></div></div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="controls-hint">
        P1: WASD (Move) | Space (Punch) | Shift (Kick) <br>
        P2: Arrows (Move) | Enter (Punch) | P (Kick)
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 1000;
canvas.height = 500;

const gravity = 0.6;
const groundY = 420;
let hitStop = 0;
let shake = 0;
const particles = [];
const ghostFrames = []; // For motion blur
const keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

class Particle {
    constructor(x, y, color, speed = 10) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * speed;
        this.vy = (Math.random() - 0.5) * speed;
        this.radius = Math.random() * 3;
        this.color = color;
        this.life = 1.0;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.04;
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Stickman {
    constructor(x, color, controls, id) {
        this.id = id;
        this.x = x;
        this.y = groundY;
        this.color = color;
        this.controls = controls;
        this.velX = 0;
        this.velY = 0;
        this.health = 100;
        this.isAttacking = false;
        this.attackType = 'punch'; // 'punch' or 'kick'
        this.attackFrame = 0;
        this.isJumping = false;
        this.facing = id === 1 ? 1 : -1;
        this.hitStun = 0;
        this.walkCycle = 0;
    }

    draw(isGhost = false) {
        const opacity = isGhost ? 0.3 : 1;
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = isGhost ? 2 : 4;
        ctx.lineCap = 'round';
        ctx.shadowBlur = isGhost ? 0 : 15;
        ctx.shadowColor = this.color;

        const bob = Math.sin(Date.now() / 150) * 2;
        const headY = this.y - 80 + bob;
        const bodyY = this.y - 50 + bob;

        // Head
        ctx.beginPath();
        ctx.arc(this.x, headY, 7, 0, Math.PI * 2);
        ctx.stroke();

        // Body
        ctx.beginPath();
        ctx.moveTo(this.x, headY + 7);
        ctx.lineTo(this.x, bodyY + 20);
        ctx.stroke();

        // Legs
        let legSpread = 10;
        if (this.velX !== 0) {
            this.walkCycle += 0.2;
            legSpread = Math.sin(this.walkCycle) * 15;
        }
        ctx.beginPath();
        ctx.moveTo(this.x, bodyY + 20);
        ctx.lineTo(this.x - 10 + legSpread, this.y);
        ctx.moveTo(this.x, bodyY + 20);
        ctx.lineTo(this.x + 10 - legSpread, this.y);
        ctx.stroke();

        // Arms / Combat
        if (this.isAttacking) {
            const progress = this.attackFrame / 15;
            const reach = Math.sin(progress * Math.PI) * 40;
            const armY = this.attackType === 'punch' ? bodyY + 5 : bodyY + 20;
            
            ctx.beginPath();
            ctx.moveTo(this.x, bodyY + 5);
            ctx.lineTo(this.x + (reach * this.facing), armY);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(this.x, bodyY + 5);
            ctx.lineTo(this.x - 10, bodyY + 15);
            ctx.moveTo(this.x, bodyY + 5);
            ctx.lineTo(this.x + 10, bodyY + 15);
            ctx.stroke();
        }
        ctx.restore();
    }

    update(opponent) {
        if (this.hitStun > 0) this.hitStun--;

        if (this.hitStun === 0) {
            if (keys[this.controls.left]) { this.velX = -5; this.facing = -1; }
            else if (keys[this.controls.right]) { this.velX = 5; this.facing = 1; }
            else { this.velX *= 0.8; }

            if (keys[this.controls.up] && !this.isJumping) {
                this.velY = -14;
                this.isJumping = true;
            }

            if (keys[this.controls.attackPunch] && !this.isAttacking) {
                this.isAttacking = true;
                this.attackType = 'punch';
                this.attackFrame = 0;
            } else if (keys[this.controls.attackKick] && !this.isAttacking) {
                this.isAttacking = true;
                this.attackType = 'kick';
                this.attackFrame = 0;
            }
        }

        this.x += this.velX;
        this.y += this.velY;
        this.velY += gravity;

        if (this.y >= groundY) {
            this.y = groundY;
            this.velY = 0;
            this.isJumping = false;
        }

        if (this.isAttacking) {
            this.attackFrame++;
            if (this.attackFrame === 7) {
                const dist = Math.abs(this.x - opponent.x);
                const reach = this.attackType === 'punch' ? 60 : 80;
                if (dist < reach && Math.abs(this.y - opponent.y) < 40) {
                    this.hitOpponent(opponent);
                }
            }
            if (this.attackFrame > 15) this.isAttacking = false;
        }
    }

    hitOpponent(opponent) {
        const dmg = this.attackType === 'punch' ? 8 : 15;
        const knock = this.attackType === 'punch' ? 10 : 20;
        
        opponent.health -= dmg;
        opponent.hitStun = 15;
        opponent.velX = this.facing * knock;
        opponent.velY = -5;
        
        hitStop = 5; // Freeze game briefly
        shake = knock; 
        
        for (let i = 0; i < 20; i++) {
            particles.push(new Particle(opponent.x, opponent.y - 40, '#fff'));
            particles.push(new Particle(opponent.x, opponent.y - 40, this.color));
        }
    }
}

const p1 = new Stickman(200, '#00f2ff', { 
    left: 'KeyA', right: 'KeyD', up: 'KeyW', attackPunch: 'Space', attackKick: 'ShiftLeft' 
}, 1);

const p2 = new Stickman(800, '#ff007f', { 
    left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', attackPunch: 'Enter', attackKick: 'KeyP' 
}, 2);

function drawBackground() {
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=40) {
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for(let i=0; i<canvas.height; i+=40) {
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); ctx.stroke();
    }
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
}

function loop() {
    if (hitStop > 0) {
        hitStop--;
        requestAnimationFrame(loop);
        return;
    }

    ctx.save();
    if (shake > 0) {
        ctx.translate(Math.random() * shake - shake/2, Math.random() * shake - shake/2);
        shake *= 0.9;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();

    // Ghosting Effect
    if (p1.isAttacking || p2.isAttacking) {
        ghostFrames.push({p1X: p1.x, p1Y: p1.y, p2X: p2.x, p2Y: p2.y});
        if (ghostFrames.length > 5) ghostFrames.shift();
    }

    ghostFrames.forEach((gf, i) => {
        ctx.globalAlpha = i * 0.05;
        // Simplified ghost draw
        ctx.strokeStyle = p1.color; ctx.strokeRect(gf.p1X-10, gf.p1Y-80, 20, 80);
        ctx.strokeStyle = p2.color; ctx.strokeRect(gf.p2X-10, gf.p2Y-80, 20, 80);
    });
    ctx.globalAlpha = 1;

    p1.update(p2);
    p2.update(p1);
    p1.draw();
    p2.draw();

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    ctx.restore();
    
    document.getElementById('p1-health').style.width = p1.health + '%';
    document.getElementById('p2-health').style.width = p2.health + '%';

    if (p1.health <= 0 || p2.health <= 0) {
        ctx.fillStyle = "white";
        ctx.font = "bold 60px Arial";
        ctx.textAlign = "center";
        ctx.fillText(p1.health <= 0 ? "PLAYER 2 DOMINATES" : "PLAYER 1 DOMINATES", canvas.width/2, canvas.height/2);
        return;
    }

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
